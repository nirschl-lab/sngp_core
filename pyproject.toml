[project]
name = "sngp-core"
version = "0.1.0"
dependencies = [
    "albumentationsx>=2.0.12",
    "click>=8.2.1",
    "datasets>=4.0.0",
    "email-validator>=2.3.0",
    "h5py>=3.14.0",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "hydra-joblib-launcher>=1.2.0",
    "hydra-optuna-sweeper>=1.2.0",
    "hydra-submitit-launcher>=1.2.0",
    "ipykernel>=6.30.1",
    "lightning>=2.5.5",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "nbconvert>=7.16.6",
    "pandas>=2.3.2",
    "pandoc>=2.4",
    "pyarrow>=21.0.0",
    "pydantic>=2.11.7",
    "pytest>=8.4.2",
    "pytest-randomly>=4.0.1",
    "pytorch-lightning>=2.5.5",
    "rapidfuzz>=3.14.1",
    "rich>=15.0.0",
    "rootutils>=1.0.7",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "tiffile>=2018.10.18",
    "timm>=1.0.19",
    "torch>=2.8.0",
    "torchmetrics[image]>=1.8.2",
    "torchvision>=0.23.0",
    "ujson>=5.11.0",
    "wandb>=0.21.3",
]

[tool.pytest.ini_options]
addopts = [
    "-rsxX",
    "--last-failed",
    "--color=yes",
    "--durations=0",
    "--strict-markers",
    "--doctest-modules",
    "--showlocals"
]
python_files = "test_*.py"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: determines whether the deployed build is stable or not (select with '-m \"smoke\"')",
    "debug: marks tests as actively under debugging (deselect with '-m \"not debug\"')",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

# Predictions.csv / metrics.json locations for the Acevedo artifact-axis sweep of the
# Muon wd=0 arm of docs/results/ACEVEDO_MUON_RESULTS.md: GP head on a resnet18 with no SN
# and no spectral penalty, Muon on the hidden convs (experiment sngp_muon_acevedo,
# model.optimizer.weight_decay=0.0, run 2026-09-30_12-47-49_muon_wd0). Uses the
# val-NLL-calibrated checkpoint (best.calibrated.ckpt, mean_field_factor 7.3992) -- the
# same one behind every published Muon row -- so its probabilities are NOT on the same
# mean-field factor as the uncalibrated rows of acevedo_artifact_axis_paths.yaml /
# acevedo_specreg_artifact_axis_paths.yaml. Procedural arms from
# scripts/inference/run_eval_suite_parallel.sh (2026-09-30), config (count) arms from
# scripts/inference/run_artifact_axes.sh (2026-10-05); both recorded in
# docs/MASTER_INFER_RESULTS_PATH.md. Same shape as acevedo_artifact_axis_paths.yaml, same
# consumers. Kept as a plain YAML sidecar so these absolute /data1/... paths stay out of
# Python source per .claude/rules/conventions.md.

config_axis:
  label: "Config axis — count=1 pasted artifact overlays (artifact_balanced, procedural off)"
  models:
    SNGP + Muon:
      real_baseline: /data1/maheswararao/experiments/uncertainty-aware-ml/infer/sngp_muon_classifier_acevedo_calibrated/2026-09-30_12-47-49_muon_wd0/acevedo_artifact/real_baseline/predictions.csv
      artifact: /data1/maheswararao/experiments/uncertainty-aware-ml/infer/sngp_muon_classifier_acevedo_calibrated/2026-09-30_12-47-49_muon_wd0/acevedo_artifact/config/count_1/predictions.csv
      metrics_json: /data1/maheswararao/experiments/uncertainty-aware-ml/infer/sngp_muon_classifier_acevedo_calibrated/2026-09-30_12-47-49_muon_wd0/acevedo_artifact/config/count_1/metrics.json


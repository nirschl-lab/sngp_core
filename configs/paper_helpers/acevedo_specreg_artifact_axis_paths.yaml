      artifact: /data1/maheswararao/experiments/uncertainty-aware-ml/infer/sngp_classifier_acevedo_snb_artifact_ablation/2026-09-17_15-06-32/spectral_norm_bound_4.0/procedural/severity_1/predictions.csv

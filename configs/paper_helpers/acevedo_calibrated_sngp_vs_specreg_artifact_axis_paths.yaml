# Predictions.csv / metrics.json locations for the Acevedo procedural (severity) axis of the
# CALIBRATED SNGP vs SNGP + Spectral Reg comparison (2026-09-29), consumed by the
# "Calibrated comparison" section of docs/results/ACEVEDO_SPECREG_RESULTS.md.
#   "SNGP"                = spectral-norm SNGP at the val-selected bound c* = 6.0
#                           (bound ablation 2026-09-17_15-06-32), best.calibrated.ckpt,
#                           mean_field_factor 0.4909 fit on val NLL.
#   "SNGP + Spectral Reg" = rep-spectral pilot 2026-09-18_14-11-49, best.calibrated.ckpt,
#                           mean_field_factor 0.2455 fit on val NLL.
# The canonical model names keep the per-model colors of the other Acevedo figures. The
# procedural axis only: no config (count) arms were run for these checkpoints. Arms were
# produced by scripts/inference/run_eval_suite_parallel.sh (DATASETS="" AXES=procedural);
# everything is recorded in docs/MASTER_INFER_RESULTS_PATH.md. Same shape and consumers as
# acevedo_specreg_artifact_axis_paths.yaml (render_artifact_results_tables.py,
# artifact_ablation_curves.py, artifact_severity_curves.py).



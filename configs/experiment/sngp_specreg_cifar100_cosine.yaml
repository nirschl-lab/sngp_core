# @package _global_

# to execute this experiment run:
# python train.py experiment=sngp_specreg_cifar100_cosine
#
# sngp_specreg_cifar100 (SNGP + spectral regularization, matched SGD recipe) with TWO changes:
# warmup_piecewise_lr -> CosineAnnealingLR, and length_scale 20 -> 7 -- i.e. the cosine
# version of the evidence-l arm (scripts/tmux/cifar100_evidence_ls.sh).
#
# Why: the piecewise-schedule Muon rows trail every SGD row in-distribution
# (docs/results/CIFAR100_MUON_RESULTS.md), and the schedule is one suspect. The cosine study runs
# SNGP, SNGP + SpecReg and the Muon GP head on ONE shared schedule and ONE length scale (l = 7,
# the SpecReg evidence pick), so Muon vs SGD differs only in the optimizer and the spectral
# control. Launched by scripts/tmux/cifar100_cosine.sh. Only the schedule (and, where noted, l)
# differs from the parent, so the parent's header carries the reasoning for everything else.

defaults:
  - override /data: cifar100
  - override /model: sngp_specreg_classifier
  - override /callbacks: default
  - override /trainer: default

name: "cifar100_sngp_specreg_cosine_wrn28x10"
WANDB_PROJECT: ${oc.env:PROJECT_NAME}
tags: ["sngp_specreg", "sngp", "rep-spectral", "cifar100", "wide_resnet28_10", "benchmark", "cosine", "training"]

seed: 12345

num_classes: 100

trainer:
  min_epochs: 250
  max_epochs: 250
  accelerator: "gpu"

model:
  # Own output dir: task_name is "train/${model.name}_<dataset>".
  name: sngp_specreg_cosine_classifier
  optimizer:
    _target_: torch.optim.SGD
    _partial_: true
    lr: 0.04
    momentum: 0.9
    nesterov: true
    weight_decay: 6e-4   # matched to sngp_cifar100.yaml -- see header
  net:
    arch: wide_resnet28_10
    num_classes: ${num_classes}
    pretrained: false
    # use_spectral_norm / spectral_norm_bound come from the model config (false / null).
    # GP head matched to sngp_cifar100.yaml so the two arms differ only in the regularizer.
    length_scale: 7.0   # the cosine study's shared l -- see header
    scale_random_features: false
    ridge_penalty: 1.0
    normalize_input: false
    mean_field_factor: 7.5
  # Regularized from epoch 1 -- spectral normalization is active from step 0 in the SNGP
  # arm, so anything longer would compare a regularized model against an unregularized
  # one for most of training. (1 rather than 0 because the checkpoint gate below ranks
  # epochs >= start_epoch, and the guard requires 0 < burn-in < max_epochs.)
  spec_reg_burnin_epochs: 1
  # The rep-spectral paper's gamma, kept after the 20-epoch pilot confirmed it is active
  # on this backbone rather than assumed to transfer from its ResNet18/CIFAR-10 setting.
  # Pilot at 20 epochs, gamma 0.01 vs 0.0025: sum(sigma^2) 227 vs 314, sigma_max 4.06 vs
  # 4.88 -- so 0.01 measurably constrains the spectrum -- while CE (1.250 vs 1.238) and
  # train accuracy (0.634 vs 0.632) are unchanged. A lower gamma buys nothing here.
  spec_reg_coef: 0.01
  spec_reg_every_n_steps: 24
  spec_reg_conv_mode: operator
  spec_reg_n_power_iterations: 1
  compile: false
  scheduler:
    # The Acevedo schedule (sngp_acevedo.yaml et al.): cosine from the peak LR to 0 over the
    # full budget, stepped once per epoch, no warmup. Scales every optimizer param group.
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}
    eta_min: 0.0
  num_classes: ${num_classes}

data:
  datamodule:
    batch_size: 128

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: "${tags_with:${tags},${data.datamodule.institution}}"
    group: "CIFAR100"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  model_checkpoint:
    _target_: src.callbacks.model_checkpoint_from_epoch.ModelCheckpointFromEpoch
    monitor: "val/loss"
    mode: "min"
    start_epoch: ${model.spec_reg_burnin_epochs}
  early_stopping: null
  test_artifacts:
    hist_bins: 10

# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: acevedo_image_classifier
  - override /model: timm_basic_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "kather2016_base"
tags: ["kather_et_al_2016", "baseline", "training", "paper_exp1"]

seed: 12345

trainer:
  min_epochs: 5
  max_epochs: 50
  accelerator: "gpu"


model:
  optimizer:
    lr: 0.001
  hist_bins: 10
  net:
    drop_rate: 0.2  # TODO: check how baseline vs. mc-baseline differ
    num_classes: 8
  compile: false

data:
  datamodule:
    dataset_name: "nirschl-lab/kather_et_al_2016"
    num_classes: 8
    batch_size: 256

logger:
  wandb:
    tags: ${tags}
    group: "paper_exp1"
    name: "Training: Kather2016_baseline"
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/loss"
    patience: 20
    mode: "min"
    min_delta: 0.005
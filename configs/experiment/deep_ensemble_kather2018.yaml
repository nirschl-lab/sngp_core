# @package _global_

# to execute this experiment run:
# python train.py experiment=deep_ensemble_kather2018

defaults:
  - override /data: kather2018
  - override /model: deep_ensemble_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "kather2018_deep_ensemble_resnet18"
WANDB_PROJECT: "final_experiments"
tags: ["kather_et_al_2018", "resnet18", "training", "deep_ensemble", "uncertainty"]

seed: 12345

num_classes: 9
num_estimators: 5  # Number of ensemble members

trainer:
  min_epochs: 150
  max_epochs: 750  # 5 members x 150 epochs each -- matches the baseline's per-model budget
  accelerator: "gpu"

model:
  num_estimators: ${num_estimators}
  train_strategy: sequential  # Train one member at a time

  optimizer:
    lr: 1e-3
    weight_decay: 1e-3

  net:
    base_model_spec:
      name: baseline_classifier
      arch: resnet18
      num_classes: ${num_classes}
      dropout_p: 0.2
      pretrained: false
    num_estimators: ${num_estimators}
    task: classification

  compile: false

  scheduler:
    # A single scheduler steps continuously across the whole 750-epoch run --
    # set_active_member() only routes the forward pass, it does not reset the
    # optimizer/scheduler per member. Plain MultiStepLR decays *cumulatively*, so
    # repeating [30,70,100] once per member window would compound to gamma**15 by the
    # last member (effectively frozen). LambdaLR instead re-applies the [30,70,100]
    # decay pattern fresh within each 150-epoch window -- see
    # src/models/components/schedulers.py::cyclical_multistep_lr_lambda.
    _target_: torch.optim.lr_scheduler.LambdaLR
    _partial_: true
    lr_lambda:
      _target_: src.models.components.schedulers.cyclical_multistep_lr_lambda
      epochs_per_member: 150
      milestones: [30, 70, 100]
      gamma: 0.1

  num_classes: ${num_classes}
  class_freq: ${data.class_freq}

data:
  datamodule:
    batch_size: 128
    sample_rate: 0

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: ${tags}
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    # Disabled: validation runs the FULL ensemble, so val/f1 dips every time a fresh,
    # untrained member becomes active (see DeepEnsembleLitModule.on_train_epoch_start).
    # A patience-based monitor would kill the run mid-cycle. The per-member epoch
    # budget is fixed by design instead (trainer.max_epochs / num_estimators).
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "val/f1"
    patience: 999999
    mode: "max"
  model_checkpoint:
    monitor: "val/f1"
    mode: "max"
    save_top_k: 1
    save_last: True
    verbose: True
    filename: "epoch_{epoch:03d}"
    auto_insert_metric_name: False
  test_artifacts:
    hist_bins: 10

# @package _global_

# to execute this experiment run:
# python train.py experiment=sngp_muon_sgd_cifar100_cosine
#
# sngp_muon_cifar100_cosine (GP head on an unconstrained WRN-28-10, Muon on the 27 hidden convs,
# cosine LR, l = 7) with ONE change: the aux optimizer -- the stem, every BatchNorm affine and
# the GP output layer -- is SGD-Nesterov with the SGD arms' exact recipe (lr 0.04, momentum 0.9,
# L2 6e-4, src.models.components.optimizers.MuonWithAuxSGD) instead of AdamW at wd 0.01.
#
# Why: measured on 2000 val images at last.ckpt, the AdamW-aux Muon arms ended with final-BN
# |gamma| 1.25-1.34 vs 0.38 for the SGD arms, so ||h|| / l was 2.0-2.3 vs 1.23 and the same-class
# RBF kernel at l = 7 was 0.35 vs 0.75. The GP output layer ||beta||_F was 44-55 vs 12, and val
# NLL / ECE rose through training. The aux group holds <0.1% of the parameters but sets the
# feature scale the kernel sees and the logit scale; under AdamW's lr * wd = 1e-5 nothing held
# them. With SGD on that group, Muon-vs-SGD differs only on the hidden convs. This is also the
# airbench Muon recipe (Muon for conv filters, SGD for norms and head). Launched by
# scripts/tmux/cifar100_cosine.sh (arms cos_muonsgd_wd{0.1,0}_s12345).

defaults:
  - override /data: cifar100
  - override /model: sngp_classifier
  - override /callbacks: default
  - override /trainer: default

name: "cifar100_sngp_muon_sgd_cosine_wrn28x10"
WANDB_PROJECT: ${oc.env:PROJECT_NAME}
tags: ["sngp", "muon", "muon-sgd", "no-spectral-norm", "cifar100", "wide_resnet28_10", "benchmark", "cosine", "training"]

seed: 12345

num_classes: 100

trainer:
  min_epochs: 250
  max_epochs: 250
  accelerator: "gpu"

model:
  # Own output dir: task_name is "train/${model.name}_<dataset>".
  name: sngp_muon_sgd_cosine_classifier
  optimizer:
    _target_: src.models.components.optimizers.MuonWithAuxSGD
    _partial_: true
    lr: 0.02
    momentum: 0.95
    weight_decay: 0.1
    sgd_lr: 0.04
    sgd_momentum: 0.9
    sgd_nesterov: true
    sgd_weight_decay: 6e-4   # = the SGD arms' L2, on the stem / BN / GP output layer
  net:
    arch: wide_resnet28_10
    num_classes: ${num_classes}
    pretrained: false
    use_spectral_norm: false
    spectral_norm_bound: null
    length_scale: 7.0
    scale_random_features: false
    ridge_penalty: 1.0
    normalize_input: false
    mean_field_factor: 7.5
  compile: false
  scheduler:
    # The Acevedo schedule (sngp_acevedo.yaml et al.): cosine from the peak LR to 0 over the
    # full budget, stepped once per epoch, no warmup. Scales every optimizer param group.
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}
    eta_min: 0.0
  num_classes: ${num_classes}

data:
  datamodule:
    batch_size: 128

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: "${tags_with:${tags},${data.datamodule.institution}}"
    group: "CIFAR100"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
  early_stopping: null
  test_artifacts:
    hist_bins: 10

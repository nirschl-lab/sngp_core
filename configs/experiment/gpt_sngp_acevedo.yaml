# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: acevedo_image_classifier
  - override /model: sngp_gpt
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "acevedo_gpt_resnet50_nllloss"
WANDB_PROJECT: "gpt_sngp_model"
tags: ["acevedo_et_al_2020", "SNGP", "training", "resnet50", "pretrained=false", "weight_decay=1e-3", "no_color_jitter", 'batch_size=128']

seed: 12345

trainer:
  min_epochs: 5
  max_epochs: 150
  accelerator: "gpu"


model:
  optimizer:
    lr: 1e-3
    weight_decay: 1e-3
  hist_bins: 10
  net:
    arch: "resnet50"
    num_classes: 8
    pretrained: false
  compile: false
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    _partial_: true
    milestones: [30, 70, 100]
    gamma: 0.1

data:
  datamodule:
    dataset_name: "nirschl-lab/acevedo_et_al_2020"
    num_classes: 8
    batch_size: 128

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: ${tags}
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/loss"
    patience: 20
    mode: "min"
    min_delta: 0.005

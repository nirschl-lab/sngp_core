# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: kather2018
  - override /model: sngp_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "kather2018_sngp_resnet18"
WANDB_PROJECT: "final_experiments"
tags: ["kather_et_al_2018", "resnet18", "training", "sngp"]
seed: 12345

num_classes: 9

trainer:
  min_epochs: 30
  max_epochs: 150
  accelerator: "gpu"

model:
  optimizer:
    lr: 1e-3
    weight_decay: 1e-3
  net:
    arch: "resnet18"
    num_classes: ${num_classes}
    pretrained: false
  compile: false
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}
    eta_min: 0.0
  num_classes: ${num_classes}
  class_freq: ${data.class_freq}

data:
  datamodule:
    batch_size: 128
    sample_rate: 0

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: ${tags}
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/f1"
    patience: 20
    mode: "max"
    min_delta: 0.005
  test_artifacts:
    hist_bins: 10

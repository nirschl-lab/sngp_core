# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: acevedo_image_classifier
  - override /model: timm_sngp_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["tang_et_al_2019", "SNGP", 'training']

seed: 12345

trainer:
  min_epochs: 5
  max_epochs: 50
  accelerator: "gpu"


model:
  optimizer:
    lr: 0.0001
  hist_bins: 10
  net:
    num_classes: 4
  compile: false

data:
  datamodule:
    dataset_name: "nirschl-lab/tang_et_al_2019"
    num_classes: 4
    batch_size: 256

logger:
  wandb:
    tags: ${tags}
    group: "paper_exp1"
    name: "Training: Tang_sngp"
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/loss"
    patience: 10
    mode: "min"
    min_delta: 0.005
# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: acevedo_image_classifier
  - override /model: timm_sngp_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "acevedo_sngp_scratch"
tags: ["acevedo_et_al_2020", "SNGP", "training"]

seed: 12345

trainer:
  min_epochs: 5
  max_epochs: 200
  accelerator: "gpu"


model:
  optimizer:
    lr: 0.0001
  hist_bins: 10
  net:
    num_classes: 8
    pretrained: False
  compile: false

data:
  datamodule:
    dataset_name: "nirschl-lab/acevedo_et_al_2020"
    num_classes: 8
    batch_size: 256

logger:
  wandb:
    tags: ${tags}
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/loss"
    patience: 20
    mode: "min"
    min_delta: 0.005
# @package _global_

# to execute this experiment run:
# python train.py experiment=sngp_muon_2stage_wong_sgd
#
# ADRC study, Muon -> SGD two-stage arm: sngp_muon_wong_sgd.yaml (the Muon arm, at its final
# cell wd 0.01) with the two-stage optimization of Shen et al. 2026 (arXiv:2606.21514, "river
# valley": Muon moves fast early but oscillates near the optimum, so a GD-like optimizer refines
# late). 0-based epochs:
#   0-4     linear warmup (factor 0.1 -> 1): Muon 0.002 -> 0.02, SGD aux 0.001 -> 0.01
#   5-119   constant: Muon 0.02 on the hidden convs, SGD + Nesterov 0.01 on stem / BN / GP head
#   120-149 every param on SGD + Nesterov (L2 6e-4), cosine 0.01 -> 1e-4 for all groups
# The switch is MuonToSGDSwitch (src/callbacks/muon_to_sgd_switch.py); it resets the hidden
# convs' momentum buffers. vs the Muon arm this changes TWO things -- the schedule/stage-2 and
# the aux SGD lr (0.04 -> 0.01) -- so a difference is not attributable to the switch alone.

defaults:
  - override /data: wong
  - override /model: sngp_classifier
  - override /callbacks: default
  - override /trainer: default

name: "wong_sngp_muon_2stage_resnet18"
WANDB_PROJECT: ${oc.env:PROJECT_NAME}
tags: ["sngp", "muon", "muon-sgd", "two-stage", "no-spectral-norm", "wong", "resnet18", "sgd", "adrc", "training"]

seed: 12345

num_classes: 4

trainer:
  min_epochs: 30
  max_epochs: 150
  accelerator: "gpu"

model:
  name: sngp_muon_2stage_classifier
  optimizer:
    _target_: src.models.components.optimizers.MuonWithAuxSGD
    _partial_: true
    lr: 0.02
    momentum: 0.95
    weight_decay: 0.01 # the Muon arm's final cell
    sgd_lr: 0.01
    sgd_momentum: 0.9
    sgd_nesterov: true
    sgd_weight_decay: 6e-4 # = the SGD arms' L2, on the stem / BN / GP output layer
  net:
    arch: resnet18
    num_classes: ${num_classes}
    pretrained: false
    use_spectral_norm: false
    spectral_norm_bound: null
    length_scale: 20.0
    normalize_input: false
    scale_random_features: false
    ridge_penalty: 1.0
    mean_field_factor: 0.39269908 # pi/8
    kernel_amplitude: 1.0
  compile: false
  scheduler:
    _target_: src.models.components.schedulers.warmup_constant_cosine_lr
    _partial_: true
    T_max: ${trainer.max_epochs}
    warmup_epochs: 5
    warmup_start_factor: 0.1
    cosine_start_epoch: 120
    cosine_peak_lr: 0.01
    cosine_final_lr: 1e-4
    eta_min: 0.0
  num_classes: ${num_classes}

data:
  datamodule:
    batch_size: 128

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: "${tags_with:${tags},${data.datamodule.institution}}"
    group: "adrc"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  model_checkpoint:
    monitor: "val/nll"
    mode: "min"
  early_stopping:
    monitor: "val/nll"
    mode: "min"
  test_artifacts:
    hist_bins: 10
  muon_to_sgd_switch:
    _target_: src.callbacks.muon_to_sgd_switch.MuonToSGDSwitch
    switch_epoch: ${model.scheduler.cosine_start_epoch}
    momentum: 0.9
    nesterov: true
    weight_decay: 6e-4 # coupled L2 on the hidden convs in stage 2, = the aux group's

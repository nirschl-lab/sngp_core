# @package _global_

# to execute this experiment run:
# python train.py experiment=baseline_cifar100_cosine
#
# baseline_cifar100 (deterministic WRN-28-10, linear head, SGD-Nesterov 0.04 / L2 6e-4) with ONE
# change: the cosine schedule of the *_cifar100_cosine SNGP experiments instead of the
# warmup/piecewise one. It is the [SGD] half of the optimizer-only comparison against
# baseline_muon_sgd_cifar100_cosine: no GP head, so a Muon-vs-SGD gap here is the optimizer's own,
# not an interaction with the kernel. Launched by scripts/tmux/cifar100_cosine.sh
# (arm cos_baseline_s12345).
#
# Deviations from the protocol defaults, mirrored in tests/test_configs.py::_SELECTION_OVERRIDES:
# no early stopping and selection on `val/loss` (the CIFAR benchmark recipe).

defaults:
  - override /data: cifar100
  - override /model: baseline_classifier
  - override /callbacks: default
  - override /trainer: default

name: "cifar100_baseline_cosine_wrn28x10"
WANDB_PROJECT: ${oc.env:PROJECT_NAME}
tags: ["baseline", "cifar100", "wide_resnet28_10", "benchmark", "cosine", "training"]

seed: 12345

num_classes: 100

trainer:
  min_epochs: 250
  max_epochs: 250
  accelerator: "gpu"

model:
  # Own output dir: task_name is "train/${model.name}_<dataset>".
  name: baseline_cosine_classifier
  optimizer:
    # See sngp_cifar100.yaml for why lr is 0.04 (CIFAR-100, batch 128) and weight_decay
    # is 6e-4 rather than the reference's `l2=3e-4`.
    _target_: torch.optim.SGD
    _partial_: true
    lr: 0.04
    momentum: 0.9
    nesterov: true
    weight_decay: 6e-4
  net:
    arch: wide_resnet28_10
    num_classes: ${num_classes}
    pretrained: false
    # 0.0, not the family's 0.2: the reference deterministic WRN has no head dropout.
    # The backbone still carries the reference's filter-wise dropout 0.1 internally, which
    # every CIFAR arm shares. Consequence: MC-Dropout at inference is not meaningful for
    # this checkpoint, which is fine -- it is an accuracy/calibration anchor, not an
    # uncertainty method.
    dropout_p: 0.0
  compile: false
  scheduler:
    # The Acevedo schedule, as in the *_cifar100_cosine SNGP experiments: cosine from the peak
    # LR to 0 over the full budget, stepped once per epoch, no warmup. Scales every param group.
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}
    eta_min: 0.0
  num_classes: ${num_classes}

data:
  datamodule:
    batch_size: 128

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: "${tags_with:${tags},${data.datamodule.institution}}"
    group: "CIFAR100"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
  early_stopping: null
  test_artifacts:
    hist_bins: 10

# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: acevedo_image_classifier
  - override /model: timm_sngp_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["acevedo_et_al_2020", "sngp", "paper_exp1", "val_loss_early_stop", 'lr_1e-4', 'only_50_epochs']

seed: 12345

trainer:
  min_epochs: 5
  max_epochs: 50
  accelerator: "gpu"


model:
  optimizer:
    lr: 0.0001
  hist_bins: 10
  net:
    num_classes: 8
    model_name: "resnet50"
    reduction_dim: 512
    pretrained: true
  compile: false

data:
  datamodule:
    dataset_name: "nirschl-lab/acevedo_et_al_2020"
    num_classes: 8
    batch_size: 256

logger:
  wandb:
    tags: ${tags}
    group: "paper_exp2"
    name: "SNGP Acevedo"
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/loss"
    patience: 20
    mode: "min"
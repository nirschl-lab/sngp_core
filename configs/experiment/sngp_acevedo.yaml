# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: acevedo
  - override /model: sngp_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "acevedo_sngp_resnet18"
WANDB_PROJECT: ${oc.env:PROJECT_NAME}
tags: ["sngp", "acevedo", "resnet18", "training"]
seed: 12345

num_classes: 8

trainer:
  min_epochs: 30
  max_epochs: 150
  accelerator: "gpu"

model:
  optimizer:
    lr: 0.0008075409385471564
    weight_decay: 0.00010301760471884074
  net:
    arch: "resnet18"
    num_classes: ${num_classes}
    pretrained: false
    rff_dim: 1024            # 256–1024 is a good range
    length_scale: 14.593478563256147
    ridge_penalty: 0.0014365309998562027
    cov_momentum: 0.999

  compile: false
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}
    eta_min: 0.0
  num_classes: ${num_classes}
  class_freq: ${data.class_freq}

data:
  datamodule:
    batch_size: 128

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: "${tags_with:${tags},${data.datamodule.institution}}"
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/f1"
    patience: 20
    mode: "max"
    min_delta: 0.005
  test_artifacts:
    hist_bins: 10

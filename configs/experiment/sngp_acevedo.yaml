# @package _global_

# to execute this experiment run:
# python train.py experiment=sngp_acevedo

defaults:
  - override /data: acevedo
  - override /model: sngp_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "acevedo_sngp_resnet18"
WANDB_PROJECT: ${oc.env:PROJECT_NAME}
tags: ["sngp", "acevedo", "resnet18", "training"]

seed: 12345

num_classes: 8

trainer:
  min_epochs: 30
  max_epochs: 150
  accelerator: "gpu"

model:
  optimizer:
    # Shared protocol defaults pending the W&B re-sweep (calibrated val-NLL objective,
    # plain CE, canonical SNGP head) -- docs/HPO_GUIDE.md. Previous values (Optuna,
    # macro-AUPRC objective, class-balanced focal loss) kept for the record.
    lr: 0.009157924694202957  # was 0.0008075409385471564
    weight_decay: 3.746886442236255e-05  # was 0.00010301760471884074
  net:
    # All family constants live in configs/model/sngp_classifier.yaml -- do not
    # repeat them here (tests/test_configs.py).
    # Pre-correction sweep (off-regime, not reused): length_scale 14.593478563256147,
    # ridge_penalty 0.0014365309998562027, cov_momentum 0.999.
    arch: resnet18
    num_classes: ${num_classes}
    pretrained: false
    mean_field_factor: 1.0
  compile: false
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}
    eta_min: 0.0
  num_classes: ${num_classes}
  # Loss: plain cross-entropy, inherited from the model config. `class_freq` is
  # deliberately NOT interpolated from ${data.class_freq} -- imbalance is handled at
  # reporting time (macro metrics), never in the loss. Was ClassBalancedFocalLoss(cb_beta=0.999, focal_gamma=2.0) via the
  # model-config defaults.

data:
  datamodule:
    batch_size: 64

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: "${tags_with:${tags},${data.datamodule.institution}}"
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  # model_checkpoint / early_stopping: inherited from configs/callbacks/default.yaml
  # (val/nll_cal, mode min) -- one place, not one per experiment.
  test_artifacts:
    hist_bins: 10

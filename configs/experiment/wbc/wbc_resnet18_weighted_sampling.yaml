# @package _global_

defaults:
  - override /data: wbc_weighted_sampler
  - override /model: wbc_classifier
  - override /callbacks: default
  - override /trainer: default

# Override the checkpoint path here
ckpt_path: nirschl-lab/wbc_challenge/model-mz5kktdt:v0
resume_training: false

name: "resnet18_weighted_sampling_5epoch"
WANDB_PROJECT: "resnet18"

seed: 12345

base_lr: 1e-4
train_batch_size: 64
val_batch_size: 1024
test_batch_size: 1024
num_classes: 13

trainer:
  min_epochs: 1
  max_epochs: 5
  accelerator: "gpu"
  # limit_train_batches: 2
  # limit_val_batches: 5

model:
  optimizer:
    lr: ${base_lr}
    weight_decay: 1e-3
  hist_bins: 10
  net:
    arch: resnet18
    num_classes: ${num_classes}
    dropout_p: 0.2
    pretrained: True
  compile: false
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    _partial_: true
    milestones: [30, 70, 100]
    gamma: 0.1
  csv_save_path: "csv/wbc/"
  csv_name: ${name}
  num_classes: ${num_classes}
  class_weights: null #[0.17, 0.28, 0.8, 1.12, 2.61, 5.17, 4.98, 5.66, 5.89, 6.68, 21.63, 44.01, 196.36]
  label_smoothing: 0.1
  loss_function: 'cross_entropy'

data:
  datamodule:
    data_dir: /data1/shared/data/wbc-bench-2026/
    train_batch_size: ${train_batch_size}
    val_batch_size: ${val_batch_size}
    test_batch_size: ${test_batch_size}
    num_workers: 32
    pin_memory: False

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: ${tags}
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/loss"
    patience: 20
    mode: "min"
    min_delta: 0.005
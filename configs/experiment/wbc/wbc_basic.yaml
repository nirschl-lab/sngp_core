# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: wbc_classifier
  - override /model: wbc_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "baseline_resnet50"
WANDB_PROJECT: "wbc_challenge"

seed: 12345

base_lr: 1e-3
# base_batch_size: 128
curr_batch_size: 128
num_classes: 13

trainer:
  min_epochs: 30
  max_epochs: 200
  accelerator: "gpu"
  # limit_train_batches: 2
  # limit_val_batches: 5

model:
  optimizer:
    lr: ${base_lr}
    weight_decay: 1e-3
  hist_bins: 10
  net:
    arch: resnet50
    num_classes: ${num_classes}
    dropout_p: 0.2
    pretrained: false
  compile: false
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    _partial_: true
    milestones: [30, 70, 100]
    gamma: 0.1
  num_classes: ${num_classes}
  class_weights: null

data:
  datamodule:
    data_dir: /data1/shared/data/wbc-bench-2026/
    batch_size: 64
    num_workers: 32
    pin_memory: False

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: ${tags}
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/loss"
    patience: 20
    mode: "min"
    min_delta: 0.005
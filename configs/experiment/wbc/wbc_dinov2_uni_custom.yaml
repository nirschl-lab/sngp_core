# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: wbc_classifier
  - override /model: dinov2_uni_custom
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "dinov2_uni_custom"
WANDB_PROJECT: "wbc_dinov2"

seed: 12345

base_lr: 1e-4
train_batch_size: 64
val_batch_size: 1024
test_batch_size: 1024
num_classes: 13

trainer:
  min_epochs: 20
  max_epochs: 50
  accelerator: "gpu"
  # limit_train_batches: 2
  # limit_val_batches: 5

model:
  compile: false
  csv_save_path: "csv/wbc/"
  csv_name: ${name}
  num_classes: ${num_classes}
  class_weights: null #[0.17, 0.28, 0.8, 1.12, 2.61, 5.17, 4.98, 5.66, 5.89, 6.68, 21.63, 44.01, 196.36]
  label_smoothing: 0.0
  loss_function: 'cross_entropy'
  max_epochs: ${trainer.max_epochs}
  warmup_ratio: 0.1


data:
  datamodule:
    data_dir: /data1/shared/data/wbc-bench-2026/
    train_batch_size: ${train_batch_size}
    val_batch_size: ${val_batch_size}
    test_batch_size: ${test_batch_size}
    num_workers: 32
    pin_memory: False

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: ${tags}
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/f1"
    patience: 10
    mode: "max"
    min_delta: 0.0
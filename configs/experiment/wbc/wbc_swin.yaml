# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: wbc_classifier
  - override /model: swin_baseline_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "swin_s_focal_loss"
WANDB_PROJECT: "wbc_challenge"

seed: 12345

base_lr: 1e-4
# base_batch_size: 128
train_batch_size: 64
val_batch_size: 1024
test_batch_size: 1024
num_classes: 13

trainer:
  min_epochs: 30
  max_epochs: 150
  accelerator: "gpu"
  # limit_train_batches: 1
  # limit_val_batches: 1

model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: ${base_lr}
    weight_decay: 1e-3
  hist_bins: 10
  net:
    arch: swin_t
    num_classes: ${num_classes}
    dropout_p: 0.2
    pretrained: false
  compile: false
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    _partial_: true
    milestones: [30, 70, 100]
    gamma: 0.1
  csv_save_path: "csv/wbc/"
  csv_name: "swin_s_focal_loss"
  num_classes: ${num_classes}
  class_weights: [0.17, 0.28, 0.8, 1.12, 2.61, 5.17, 4.98, 5.66, 5.89, 6.68, 21.63, 44.01, 196.36]

data:
  datamodule:
    data_dir: /data1/shared/data/wbc-bench-2026/
    train_batch_size: ${train_batch_size}
    val_batch_size: ${val_batch_size}
    test_batch_size: ${test_batch_size}
    num_workers: 32
    pin_memory: False

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: ${tags}
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/loss"
    patience: 20
    mode: "min"
    min_delta: 0.005


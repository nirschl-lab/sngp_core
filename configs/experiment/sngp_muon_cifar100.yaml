# @package _global_

# to execute this experiment run:
# python train.py experiment=sngp_muon_cifar100
#
# CIFAR-100 / WRN-28-10 follow-up of the Acevedo Muon study (docs/results/ACEVEDO_MUON_RESULTS.md):
# the SNGP random-feature GP head on an UNconstrained backbone -- no spectral normalization, no
# spectral penalty -- trained with Muon (src/models/components/optimizers.py) instead of SGD.
# Launched by scripts/tmux/cifar100_muon.sh with Muon weight_decay 0 and 0.1.
#
# Against sngp_cifar100.yaml the changes are:
#   * optimizer: Muon on the 27 hidden convs (lr 0.02, momentum 0.95), AdamW at torch defaults
#     (lr 1e-3, weight_decay 0.01) on the stem, BatchNorm and the GP output layer. There is no
#     swept AdamW value for this benchmark; the group holds <0.1% of the parameters.
#   * use_spectral_norm false (and no bound).
#   * length_scale 7.0 -- the type-II evidence pick on the SpecReg backbones and its own fixed
#     point (docs/results/CIFAR100_EVIDENCE_LS_RESULTS.md), instead of the recipe's 20.
# Everything else is the benchmark recipe: 250 epochs, warmup_piecewise_lr (it scales both
# optimizer groups), batch 128, the reference head constants, and selection on plain val/loss
# with no early stopping. mean_field_factor 7.5 only shapes training-time val/loss; evaluation
# fits it on val at last.ckpt, the protocol's one post-hoc knob.

defaults:
  - override /data: cifar100
  - override /model: sngp_classifier
  - override /callbacks: default
  - override /trainer: default

name: "cifar100_sngp_muon_wrn28x10"
WANDB_PROJECT: ${oc.env:PROJECT_NAME}
tags: ["sngp", "muon", "no-spectral-norm", "cifar100", "wide_resnet28_10", "benchmark", "training"]

seed: 12345

num_classes: 100

trainer:
  min_epochs: 250
  max_epochs: 250
  accelerator: "gpu"

model:
  # Own output dir: task_name is "train/${model.name}_<dataset>".
  name: sngp_muon_classifier
  optimizer:
    _target_: src.models.components.optimizers.MuonWithAuxAdamW
    _partial_: true
    lr: 0.02
    momentum: 0.95
    weight_decay: 0.1
    adamw_lr: 1e-3
    adamw_weight_decay: 0.01
  net:
    arch: wide_resnet28_10
    num_classes: ${num_classes}
    pretrained: false
    use_spectral_norm: false
    spectral_norm_bound: null
    length_scale: 7.0
    scale_random_features: false
    ridge_penalty: 1.0
    normalize_input: false
    mean_field_factor: 7.5
  compile: false
  scheduler:
    _target_: src.models.components.schedulers.warmup_piecewise_lr
    _partial_: true
    decay_epochs: [60, 120, 160]
    reference_epochs: 200
    gamma: 0.2
    warmup_epochs: 1
    warmup_start_factor: 0.1
  num_classes: ${num_classes}

data:
  datamodule:
    batch_size: 128

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: "${tags_with:${tags},${data.datamodule.institution}}"
    group: "CIFAR100"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
  early_stopping: null
  test_artifacts:
    hist_bins: 10

# @package _global_

# to execute this experiment run:
# python train.py experiment=baseline_wong_upitt

defaults:
  - override /data: wong
  - override /model: baseline_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "wong_upitt_baseline_resnet18"
WANDB_PROJECT: ${oc.env:PROJECT_NAME}
tags: ["baseline", "wong", "resnet18", "training"]

seed: 12345

num_classes: 4

trainer:
  min_epochs: 30
  max_epochs: 150
  accelerator: "gpu"

model:
  optimizer:
    # Shared protocol defaults pending the W&B re-sweep (calibrated val-NLL objective,
    # plain CE, canonical SNGP head) -- docs/HPO_GUIDE.md. Previous values (Optuna,
    # macro-AUPRC objective, class-balanced focal loss) kept for the record.
    lr: 1e-3  # was 0.0003467984236288648 (placeholder inherited from baseline_wong_ucdavis)
    weight_decay: 1e-4  # was 1.2497503880392834e-06 (placeholder inherited from baseline_wong_ucdavis)
  net:
    # All family constants live in configs/model/baseline_classifier.yaml -- do not
    # repeat them here (tests/test_configs.py).
    arch: resnet18
    num_classes: ${num_classes}
    pretrained: false
  compile: false
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}
    eta_min: 0.0
  num_classes: ${num_classes}
  # Loss: plain cross-entropy, inherited from the model config. `class_freq` is
  # deliberately NOT interpolated from ${data.class_freq} -- imbalance is handled at
  # reporting time (macro metrics), never in the loss. Was ClassBalancedFocalLoss(cb_beta=0.999,
  # focal_gamma=2.5044458488018835).

data:
  datamodule:
    batch_size: 128  # was 64
    institution: upitt

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: "${tags_with:${tags},${data.datamodule.institution}}"
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  # model_checkpoint / early_stopping: inherited from configs/callbacks/default.yaml
  # (val/nll_cal, mode min) -- one place, not one per experiment.
  test_artifacts:
    hist_bins: 10

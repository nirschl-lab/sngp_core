# @package _global_

# to execute this experiment run:
# python train.py experiment=deep_ensemble_wong

defaults:
  - override /data: image_classifier
  - override /model: deep_ensemble_classifier
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "wong_deep_ensemble_resnet18"
WANDB_PROJECT: "final_experiments"
tags: ["wong_et_al_2022", "resnet18", "training", "deep_ensemble", "uncertainty"]

seed: 12345

base_lr: 1e-3
curr_batch_size: 128
num_classes: 4
num_estimators: 5  # Number of ensemble members

trainer:
  min_epochs: 30
  max_epochs: 150  # With 5 members, each gets ~30 epochs
  accelerator: "gpu"

model:
  num_estimators: ${num_estimators}
  train_strategy: sequential  # Train one member at a time
  uncertainty_type: variance  # Options: "variance", "entropy", "mutual_info"
  
  optimizer:
    lr: ${base_lr}
    weight_decay: 1e-3
  
  hist_bins: 10
  
  net:
    base_model_kwargs:
      arch: resnet18
      num_classes: ${num_classes}
      dropout_p: 0.2
      pretrained: false
    num_estimators: ${num_estimators}
    task: classification
  
  compile: false
  
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    _partial_: true
    milestones: [30, 70, 100]
    gamma: 0.1
  
  num_classes: ${num_classes}
  class_weights: null
  test_name: "test_predictions_ensemble_wong.csv"

data:
  datamodule:
    dataset_name: "nirschl-lab/wong_et_al_2022"
    num_classes: ${num_classes}
    batch_size: ${curr_batch_size}

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: ${tags}
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/loss"
    patience: 20
    mode: "min"
    min_delta: 0.005
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
    save_top_k: 1
    save_last: True
    verbose: True
    filename: "epoch_{epoch:03d}"
    auto_insert_metric_name: False

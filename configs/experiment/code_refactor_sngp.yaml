# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: image_classifier
  - override /model: sngp_classifier2
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
name: "acevedo_sngp_resnet18"
WANDB_PROJECT: "code_refactor"
tags: ["acevedo_et_al_2020", "resnet18", "training", "sngp"]
seed: 12345

base_lr: 1e-3
base_batch_size: 128
curr_batch_size: 128
# scaled_lr: ${float_eval:${base_lr} * ((${curr_batch_size} / ${base_batch_size})**0.5)}
num_classes: 8

trainer:
  min_epochs: 1
  max_epochs: 3
  accelerator: "gpu"

model:
  optimizer:
    lr: ${base_lr}
    weight_decay: 1e-3
  hist_bins: 10
  net:
    arch: "resnet18"
    num_classes: ${num_classes}
    pretrained: false
  compile: false
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    _partial_: true
    milestones: [30, 70, 100]
    gamma: 0.1
  num_classes: ${num_classes}
  class_weights: [1.786,0.694,1.389,0.735,1.786,1.562,0.625,0.893]

data:
  datamodule:
    dataset_name: "nirschl-lab/acevedo_et_al_2020"
    num_classes: ${num_classes}
    batch_size: ${curr_batch_size}

logger:
  wandb:
    project: "${WANDB_PROJECT}"
    tags: ${tags}
    group: "Training"
    name: ${name}
    log_model: True
  aim:
    experiment: ""

callbacks:
  early_stopping:
    monitor: "val/loss"
    patience: 20
    mode: "min"
    min_delta: 0.005

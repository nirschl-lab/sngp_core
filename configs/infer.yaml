# @package _global_

# configs/infer.yaml
defaults:
  - _self_
  - paths: default
  - data: ???
  - infer/runtime: default
  - infer/metrics: default
  - infer/save: default

# cosmetic/consistency only -- src/inference/infer.py never runs a real Hydra job, so
# this isn't consumed by hydra.run.dir here; see docs/OUTPUT_LAYOUT.md
task_name: "infer/${data.name}"

tags: ["infer"]

fold: test # train | validation | test | all

ckpt_path: ???

# The full output path is auto-derived as
# <save_path>/[deep_ensemble_|mc_]<netname_dataset>/<ckpt_run_id>/<dataset>, where
# <netname_dataset> is parsed straight out of ckpt_path (this project's own
# <model.name>_<data.name>/{runs,ensemble_members}/<run_id>/ training-output
# convention -- see docs/OUTPUT_LAYOUT.md), falling back to the checkpoint's own
# net_spec name alone if ckpt_path doesn't match that convention, unless
# infer.save.run_name is set explicitly -- see
# src/inference/infer.py::derive_default_run_name.
save_path: ${paths.log_dir}/infer

seed: null

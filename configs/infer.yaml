# @package _global_

# configs/infer.yaml
defaults:
  - _self_
  - paths: default
  - data: ???
  - infer/runtime: default
  - infer/metrics: default
  - infer/save: default

# cosmetic/consistency only -- src/inference/infer.py never runs a real Hydra job, so
# this isn't consumed by hydra.run.dir here; see docs/OUTPUT_LAYOUT.md
task_name: "infer/${data.name}"

tags: ["infer"]

fold: test # train | validation | test | all

ckpt_path: ???

# Dataset-scoped default; the actual per-run subfolder is auto-derived from the
# checkpoint itself (<model>_<ckpt_run_id>_<fold>) unless infer.save.run_name is set
# explicitly -- see src/inference/infer.py::derive_default_run_name.
save_path: ${paths.log_dir}/infer/${data.name}

seed: null

  - label: sngp_wong_ucdavis
    method: sngp
    train_dataset: wong
    is_ensemble: false
    uses_mc_dropout: false
    run_dir: sngp_classifier_wong/2026-09-01_16-58-05
    ckpt: train/sngp_classifier_wong/runs/2026-09-01_16-58-05/checkpoints/best.ckpt
    id_dataset: wong_ucdavis
    eval_datasets: [wong_ucdavis]
    paired_streams: []

  - label: sngp_wong_ucdavis_ensemble
    method: sngp_deep_ensemble
    train_dataset: wong
    is_ensemble: true
    uses_mc_dropout: false
    run_dir: deep_ensemble_sngp_classifier_wong/2026-09-01_17-00-17
    ckpt: train/sngp_classifier_wong/ensemble_members/2026-09-01_17-00-17/checkpoints/ensemble.ckpt
    id_dataset: wong_ucdavis
    eval_datasets: [wong_ucdavis]
    paired_streams: []

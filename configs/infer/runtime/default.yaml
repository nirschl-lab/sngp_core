# @package _global_

# Pure runtime knobs for inference. Model architecture is never configured here --
# the checkpoint is authoritative for that (see src/checkpointing/io.py) -- so unlike
# the old configs/infer/model/{baseline_classifier,sngp_classifier}.yaml split, one
# runtime config works for every checkpoint.
infer:
  runtime:
    device: cuda
    batch_size_override: 1024
    # Checkpoint-authoritative loading should match exactly. With strict: false a
    # missing GP buffer would leave the SNGP covariance at its init, silently producing
    # near-uniform probabilities instead of raising.
    strict: true
    use_mc_dropout: false
    mc_passes: 10

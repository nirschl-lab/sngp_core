# @package _global_

infer:
  save:
    run_name: ""
    # Artifact mode only: which stream(s) to actually run/save. The real (clean) stream is
    # bit-identical for every artifact/procedural config against the same checkpoint, so a
    # count/severity sweep should narrow this to [artifact] (after a one-time [real] run) --
    # see docs/DATASETS.md's "Saving sweep results" section. Ignored by
    # ClassificationInferenceRunner, which has no streams.
    streams: [real, artifact]
    save_csv: true
    save_metrics_json: true
    # Provenance sidecar (ckpt path, net_spec, resolved infer.* sections, column list) --
    # the only place the ckpt-to-run binding is recorded on disk, since infer.py never
    # runs a real Hydra job and so gets no .hydra/ snapshot (see docs/OUTPUT_LAYOUT.md).
    save_run_json: true
    # Per-row [M, C] ensemble-member/MC-Dropout-pass logits -- opt-in: ~4.8x a row's
    # size for a 5-member ensemble, ~8.7x for T=10 MC passes. Off by default.
    save_member_logits: false
    save_images: false
    max_images_to_save: 64

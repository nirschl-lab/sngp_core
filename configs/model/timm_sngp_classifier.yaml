_target_: src.models.timm_classification_lit_module.TimmClassificationLitModule

name: timm_sngp
# backbone
net:
  _target_: src.models.timm_classification_models.TimmSNGPClassifier
  model_name: resnet50
  num_classes: 8
  pretrained: True
  in_chans: 3
  reduction_dim: 512
  use_spec_norm: True # required for TimmSNGPClassifier
  spec_norm_bound: 0.95 # required for TimmSNGPClassifier
  spec_norm_iteration: 1 # required for TimmSNGPClassifier
  covariance_likelihood: "gaussian" # kwarg for SNGP
  covariance_momentum: 0.999 # kwarg for SNGP
  normalize_input: True # better performance when True
  output_bias_trainable: False # kwarg for SNGP
  random_features: 1024 # kwarg for SNGP
  scale_random_features: False # better performance when False, paired with trainable_kernel_scale=True
  trainable_kernel_scale: True # set True for tighter distribution around train data (based on make_moons tests); need to test ECE/OOD performance

# optimizer and scheduler
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10

# --- Training setup ---
compile: false # compile model for faster training with pytorch 2.0
num_classes: 8
hist_bins: 25 # no of bins for drawing histogram at the end of training on testset
test_name: "test_predictions.csv" # test csv name
log_csv: false
use_mean_field_logits: false # only use mean field logits for evaluation
log_test_metrics: true
class_freq: null

# --- Calibration loss configuration (NEW) ---
#| Loss                         | Mechanism                                                                          | Primary Focus                            | Sensitivity                        | Typical Weight Range |
#| ---------------------------- | ---------------------------------------------------------------------------------- | ---------------------------------------- | ---------------------------------- | -------------------- |
#| **SB-ECE (Soft-Binned ECE)** | Penalizes deviation between confidence and empirical accuracy (differentiable ECE) | Post-hoc calibration mimic               | Very mild regularizer              | **0.05–0.2**         |
#| **Soft-AvUC**                | Encourages alignment between accuracy and uncertainty via entropy-based gating     | Balances over/under-confidence           | Moderate, nonlinear                | **0.02–0.1**         |
#| **CLUE**                     | Matches per-example task loss with predicted uncertainty via squared error         | Magnitude alignment (loss ≈ uncertainty) | Can dominate if scaled too high    | **0.05–0.2**         |
#| **BSCE-GRA**                 | Scales gradient by generalized Brier score to reduce overconfident gradients       | Gradient-level calibration               | Strong effect on learning dynamics | **0.05–0.5**         |
#
#---
#
#### 🧠 How They Interact
#
#* **SB-ECE** and **Soft-AvUC** both focus on *distributional calibration* (ECE-type, confidence alignment).
#  → Good to **combine**; they target slightly different facets (bin-based vs. entropy-weighted).
#* **CLUE** operates on the **scale of per-sample losses**, aligning loss with uncertainty magnitudes.
#  → Best used as a **low-weight auxiliary term** (too high can dampen discriminative gradients).
#* **BSCE-GRA** modifies gradients directly; it effectively *replaces* rather than *adds* to CE in strength.
#  → If used together with other losses, keep it at a **lower coefficient (0.05–0.1)** to avoid overpowering CE.
#
#Thus, you can think of them as acting on **different levels**:
#
#* SB-ECE / Soft-AvUC → Output-space calibration
#* CLUE → Uncertainty-error alignment
#* BSCE-GRA → Gradient-space smoothing

#| Strategy                 | Losses Used             | Rationale                                      | Recommended Weights    |
#| ------------------------ | ----------------------- | ---------------------------------------------- | ---------------------- |
#| **Baseline Calibration** | CE + SB-ECE + Soft-AvUC | Standard uncertainty calibration               | 0.1, 0.05              |
#| **Magnitude-aware**      | + CLUE                  | Align uncertainty with loss magnitude          | +0.05–0.1              |
#| **Gradient-aware**       | + BSCE-GRA              | Smooth gradients, reduce overconfident updates | +0.05–0.1              |
#| **Full Hybrid**          | All four                | Max calibration robustness (requires tuning)   | 0.1 / 0.05 / 0.1 / 0.1 |
#
#---
#For your **SNGP + CE** training, begin with:
#> `SB-ECE: 0.1, Soft-AvUC: 0.05, CLUE: 0.1, BSCE-GRA: 0.1`
calibration_cfg:
  _target_: src.metrics.calibration_losses.CalibrationLossConfig
  # Soft-Binned ECE
  sb_ece_label_weight: 0.1
  sb_ece_label_bins: 15
  sb_ece_label_temp: 1e-2
  sb_ece_conf_weight: 0.0 # not used when set to 0
  # AvUC/SoftAvUC
  avuc_weight: 0.0 # not used when set to 0
  soft_avuc_weight: 0.05
  soft_avuc_temp: 1.0
  soft_avuc_theta: 0.5
  # CLUE
  clue_weight: 0.1 # not used when set to 0
  clue_alpha: 0.5           # trade-off α in Eq. 8
  clue_uncertainty: "entropy" # {"entropy", "gp_var"}
  clue_detach_uncertainty: True
  # BSCE-GRA
  bsce_gra_weight: 0.1 # 0.1–1.0
  bsce_gra_beta: 2.0
  bsce_gra_gamma: 2.0

log_calibration_terms: true
compute_calibration_on_val: true
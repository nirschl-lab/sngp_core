_target_: src.models.sngp_lit_module.SNGPLitModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10

net:
  _target_: src.models.baseline_models.BaselineModel
  in_dim: 384
  num_classes: 8 
  hidden: [256, 128, 128, 32] 
  p_drop: 0.1

# compile model for faster training with pytorch 2.0
compile: false

#no of bins for drawing histogram at the end of training on testset
hist_bins: 10
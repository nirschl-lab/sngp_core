_target_: src.models.baseline_lit_module.BaselineLitModule

name: timm_mc_baseline
# backbone
net:
  _target_: src.models.baseline.baseline_models.BaselineClassifier
  arch: resnet18
  num_classes: 8
  dropout_p: 0.2
  pretrained: true

class_weights: null

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001
  weight_decay: 0.0

# scheduler:
#   _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
#   _partial_: true
#   mode: min
#   factor: 0.1
#   patience: 10

scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}
    eta_min: 0.0

# --- Training setup ---
compile: false # compile model for faster training with pytorch 2.0
num_classes: 8
class_freq: null
cb_beta: 0.999 # effective-number-of-samples reweighting; 0 = uniform, closer to 1 = more aggressive
focal_gamma: 2.0 # focal-loss focusing parameter; 0 = plain class-balanced CE
use_mc: false # MC-Dropout at test/predict time only
mc_passes: 10
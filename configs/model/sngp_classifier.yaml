_target_: src.models.sngp_lit_module.SNGPLitModule

name: sngp_classifier

# SNGP constants -- fixed to Liu et al. (2022, JMLR) Table 9 / the edward2 reference
# implementation and NOT swept. This block is the ONLY place they live: experiment
# configs set just arch / num_classes / pretrained, and tests/test_configs.py checks
# both that experiments do not override these and that SNGPClassifier's ctor defaults
# agree with them. Two knobs here are deliberately not constants, and are excluded from
# that check:
#   spectral_norm_bound -- the paper's c (eq. 15); the only SNGP-specific SWEPT knob. The
#                          value below is the family default for datasets that have not
#                          been re-swept; a dataset with a swept winner pins it in
#                          configs/experiment/sngp_<dataset>.yaml (see sngp_acevedo).
#   mean_field_factor   -- the paper's kernel amplitude sigma; fit POST-HOC on validation
#                          NLL (scripts/checkpoints/calibrate_checkpoint.py), never trained
#                          or swept. Counterpart of Baseline/DE `temperature`.
net:
  _target_: src.models.sngp.sngp_classifier.SNGPClassifier
  arch: resnet18
  num_classes: 8 # experiments override via ${num_classes}
  pretrained: false # protocol constant (docs/HPO_GUIDE.md)
  # Spectral-norm upper bound c: W <- c*W/sigma only when sigma > c. Changes the trained
  # function, so it is swept ({1, 2, 4, 6, 8}; smallest c that keeps accuracy is the
  # paper's rule) and a swept winner is pinned per experiment. 6.0 = the reference CIFAR
  # value, used by any experiment that pins nothing. null = stock hard normalization
  # (sigma == 1) -- only for reproducing checkpoints written before the bound existed.
  spectral_norm_bound: 6.0
  # Whether the backbone's Conv2d/Linear layers are spectral-normalized at all. true is
  # SNGP proper. false builds a plain backbone for the spectral-*regularization* variant
  # (configs/model/sngp_specreg_classifier.yaml), which bounds sigma through a loss term
  # instead -- never combine the two. spectral_norm_bound is ignored when false.
  use_spectral_norm: true
  # Mean-field factor = kernel amplitude sigma. 1.0 (ImageNet reference) until fit
  # post-hoc; the CIFAR reference uses 20. pi/8 is the textbook probit constant but is
  # nearly inert at realistic dataset sizes.
  mean_field_factor: 1.0
  rff_dim: 1024
  # sqrt(2): W is divided by length_scale here, giving kernel exp(-|x-y|^2 / (2 ls^2));
  # edward2's gp_kernel_scale=2.0 scales the GP input by 1/sqrt(2), i.e. the same width.
  length_scale: 1.4142
  ridge_penalty: 1e-3 # seeds P = ridge*I + sum phi phi^T; inference-only
  cov_momentum: -1.0 # exact per-epoch sum with a per-epoch reset (paper scheme)
  mean_field: true # inference-only correction; training sees raw logits
  normalize_input: true # LayerNorm on the GP input ("similar to ARD")
  # Laplace weight w_i in P = ridge*I + sum_i w_i phi_i phi_i^T. `gaussian` (unit weight)
  # is the reference default for image classification and the protocol constant -- keep it
  # here, and keep it equal to SNGPClassifier's ctor default (tests/test_configs.py checks
  # both). `binary_logistic` (p_max(1-p_max)) and `trace_logistic` (1 - ||p||^2, the trace
  # of the full multinomial Hessian) are off-protocol alternatives, set per run via
  # `model.net.likelihood=...`. Inference-only: the weight never reaches the loss.
  likelihood: gaussian
  output_bias: false # reference uses a fixed zero GP output bias
  random_feature_type: orf # orf (Yu et al. 2016) | rff | simrf (simplex, Reid et al. 2023; off-protocol)
  # Scale the random features by sqrt(2/rff_dim) (~0.044 at 1024). True is the edward2
  # default and what every checkpoint in this project was trained with. The reference
  # CIFAR baseline sets it False, because the factor also multiplies the gradient
  # reaching the backbone -- invisible under this project's AdamW protocol, which
  # renormalizes per parameter, but under plain SGD it trains the backbone ~22x too
  # slowly. See docs/models/CIFAR100_BENCHMARK.md.
  scale_random_features: true
  # Random-feature map for the RBF kernel: cos (reference) | positive | hyperbolic. The
  # positive maps need rho = ||x||/length_scale <~ 1 -- fine for the CIFAR-100 recipe
  # (no input norm, l = 20, rho ~ 0.57), unusable with LayerNorm + l = sqrt(2) (rho ~ 16).
  # Off-protocol; see docs/results/CIFAR100_RF_HEAD_SWAP_RESULTS.md.
  feature_map: cos
  n_power_iterations_sn: 1

# optimizer and scheduler
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-3 # shared protocol default; per-dataset values come from the W&B re-sweep
  weight_decay: 1e-4

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: ${trainer.max_epochs}
  eta_min: 0.0

# --- Training setup ---
compile: false # compile model for faster training with pytorch 2.0
num_classes: 8

# --- Loss: plain cross-entropy, identical for every family and dataset ---
# Selection is on calibrated validation NLL; focal / class-balanced reweighting reshapes
# calibration (Mukhoti et al. 2020) and would confound the SNGP-vs-Baseline comparison.
# Imbalance is handled at REPORTING time (macro metrics), not in the loss. Experiments
# must leave these null; the dataset's class_freq stays in configs/data/<name>.yaml as
# provenance only. Non-null values are an escape hatch, not protocol -- and if ever used
# they must be identical across families for that dataset (tests/test_configs.py).
class_freq: null # non-null -> ClassBalancedFocalLoss(cb_beta, focal_gamma)
class_weights: null # non-null -> weighted CrossEntropyLoss (documented fallback)
cb_beta: 0.999 # inert unless class_freq is set
focal_gamma: 2.0 # inert unless class_freq is set
label_smoothing: 0.0

_target_: src.models.sngp_lit_module.SNGPLitModule

name: sngp_classifier
# backbone
net:
  _target_: src.models.sngp.sngp_classifier.SNGPClassifier
  num_classes: 8         # <-- change to your dataset
  arch: "resnet18"
  pretrained: True         # ok to start from ImageNet
  rff_dim: 1024            # 256–1024 is a good range
  length_scale: 1.0
  # Seeds the precision matrix (P = ridge*I + sum_i phi_i phi_i^T). Inference-time only:
  # it has no effect on the training fit -- see docs/HPO_GUIDE.md.
  ridge_penalty: 1e-3
  # -1 = exact sum over one epoch, with a per-epoch reset. This is the paper's scheme
  # and the reference default. A value in [0, 1) switches to an EMA instead.
  cov_momentum: -1.0
  mean_field: True         # applied at INFERENCE only, never in the training loss
  mean_field_factor: 0.39269908169872414  # lambda = pi/8, the probit approximation
  normalize_input: True    # LayerNorm on the GP input, per the reference implementation
  likelihood: "gaussian"   # reference default for image classification (unit Laplace
                           # weight); "binary_logistic" uses the paper's p(1-p) instead
  output_bias: False       # reference uses a fixed zero GP output bias

# optimizer and scheduler
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 2e-4
  weight_decay: 1e-4

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: ${trainer.max_epochs}
  eta_min: 0.0

# --- Training setup ---
compile: false # compile model for faster training with pytorch 2.0
num_classes: 8

class_weights: null
class_freq: null
cb_beta: 0.999 # effective-number-of-samples reweighting; 0 = uniform, closer to 1 = more aggressive
focal_gamma: 2.0 # focal-loss focusing parameter; 0 = plain class-balanced CE
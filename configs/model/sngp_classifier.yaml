defaults:
  - calibration@calibration_cfg: default
  - _self_

_target_: src.models.sngp_classification_lit_module.SNGPClassificationLitModule

name: sngp_classifier
# backbone
net:
  _target_: src.models.sngp.sngp_classifier.SNGPClassifier
  num_classes: 8         # <-- change to your dataset
  arch: "resnet18"
  pretrained: True         # ok to start from ImageNet
  rff_dim: 1024            # 256–1024 is a good range
  length_scale: 1.0
  ridge_penalty: 1e-3
  cov_momentum: 0.999
  mean_field: True

# optimizer and scheduler
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 2e-4
  weight_decay: 1e-4

scheduler:
  _target_: torch.optim.lr_scheduler.MultiStepLR
  _partial_: true
  milestones: [30, 70, 100]
  gamma: 0.1

# --- Training setup ---
compile: false # compile model for faster training with pytorch 2.0
num_classes: 8
hist_bins: 25 # no of bins for drawing histogram at the end of training on testset
test_name: "test_predictions.csv" # test csv name
log_csv: false
csv_save_path: "csv/"
log_test_metrics: true

# Calibration loss weights/config: see configs/model/calibration/default.yaml
log_calibration_terms: true
compute_calibration_on_val: true

class_weights: null
class_freq: null
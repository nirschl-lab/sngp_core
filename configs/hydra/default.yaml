# https://hydra.cc/docs/configure_hydra/intro/

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# output directory, generated dynamically on each run
run:
  dir: ${paths.log_dir}/${task_name}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
sweep:
  dir: ${paths.log_dir}/${task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
  subdir: ${hydra.job.num}

job_logging:
  handlers:
    file:
      # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
      # A flat filename, not ${task_name} -- task_name can contain "/" (e.g.
      # "train/<model>_<dataset>", see docs/OUTPUT_LAYOUT.md), and this handler
      # doesn't create intermediate directories, so a slash here breaks logging with
      # a FileNotFoundError. The run directory itself already encodes the full task
      # identity, so a flat name loses nothing.
      filename: ${hydra.runtime.output_dir}/run.log

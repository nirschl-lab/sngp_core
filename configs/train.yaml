# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - data: ???
  - model: sngp_classifier
  - callbacks: default
  - logger: wandb # set logger here or use command line (e.g. `python train.py logger=tensorboard`)
  - trainer: default
  - paths: default
  - extras: default

  # _self_ here (rather than at the end) makes this file's own values below (tags,
  # seed, ...) the BASE that experiment/hparams_search override -- not the other way
  # around. With _self_ last, this file's tags/seed silently clobbered whatever
  # experiment=X set for those same keys, since later-in-defaults-list always wins;
  # every experiment-based run was training unseeded and tagged only this file's
  # base tags regardless of which experiment config was used.
  - _self_

#  # experiment configs allow for version control of specific hyperparameters
#  # e.g. best hyperparameters for given model and datamodule
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default

  # debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null

  - hydra: default

  # if using submitit_slurm, set override after others but before _self_
  # - override /hydra/launcher: submitit_slurm

# task name, determines output directory path -- includes model family + dataset so
# runs are distinguishable on disk, not just by timestamp (see docs/OUTPUT_LAYOUT.md)
task_name: "train/${model.name}_${data.name}"

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
# empty by default -- extras()/enforce_tags() (src/utils/rich_utils.py) prompts for
# tags interactively if none are set, which is the right fallback for a bare run with
# no experiment=; every experiment config sets its own tags: [...] instead.
tags: []

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
# lightning chooses best weights based on the metric specified in checkpoint callback
test: False

# simply provide checkpoint path to resume training
ckpt_path: null

# random seed for experiment reproducibility
# most popular random seeds: https://blog.semicolonsoftware.de/the-most-popular-random-seeds/
seed: null

# flag for torch precision: 'medium', 'high' or 'highest'
precision: "medium"


# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - data: acevedo_image_classifier #mnist #acevedo # override img_augmentations in data config if needed
  - model: timm_sngp_classifier #mnist #acevedo_baseline
  - callbacks: default
  - logger: wandb # set logger here or use command line (e.g. `python train.py logger=tensorboard`)
  - trainer: default
  - paths: default
  - extras: default

#  # experiment configs allow for version control of specific hyperparameters
#  # e.g. best hyperparameters for given model and datamodule
#  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default

  # debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null

  - hydra: default

  # overrides after others but before _self_
  - override /hydra/launcher: submitit_slurm

  - _self_

# task name, determines output directory path
task_name: "train"

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
tags: ["sngp_10-17", "jjn_multirun", "sngp_param_sweep"]

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
# lightning chooses best weights based on the metric specified in checkpoint callback
test: False

# simply provide checkpoint path to resume training
ckpt_path: null

# seed for random number generators in pytorch, numpy and python.random
seed: null

# flag for torch precision: 'medium', 'high' or 'highest'
precision: "medium"

# multirun config
hydra:
  mode: MULTIRUN
  sweep:
    dir: ${paths.root_dir}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${name}_${seed}
  run:
    dir: ${paths.root_dir}/runs/${name}_seed-${seed}_${now:%H-%M-%S}

  # param sweep combinations
  # Note: Sweeper params apply to the final composed config, not to subtrees that are replaced later
  sweeper:
    params:
      ## Notes
      # nested overrides: Hydra only applies '+' overrides when the key does not exist in the main/base/subtree config.
      # nested overrides: Hydra applies '++' to force override keys that do exist in the main/base/subtree config.
      # overrides need to be applied to the correct subtree
      +experiment: ["baseline_acevedo","sn_sngp_acevedo"] #,"baseline_tang","sn_sngp_tang"]#,"baseline_wong","sn_sngp_wong"] #,"baseline_kather_2016","sn_sngp_kather_2016","baseline_kather_2018","sn_sngp_kather_2018"]
      ++logger.wandb.project: "baseline_vs_sngp" # project name in wandb
      seed:  0,1,1234,380843,42
      # most popular random seeds: https://blog.semicolonsoftware.de/the-most-popular-random-seeds/

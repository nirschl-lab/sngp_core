defaults:
  - /img_augmentations: cifar32

# Short, path-safe dataset identifier -- drives task_name/output-directory naming
# (see docs/OUTPUT_LAYOUT.md). Distinct from datamodule.dataset_name below, which is
# the full HuggingFace repo id and unsafe to use as a directory segment.
name: cifar100

# CIFAR/SVHN are not in the nirschl-lab schema (no image_id, no classes_to_idx, no
# validation split), so they load through BenchmarkImageDataModule rather than
# ClassificationImageDataModule. See docs/DATASETS.md.
# CIFAR-100 is exactly balanced: 500 train images per class, 450 after the
# stratified 5k validation carve. Provenance only -- the protocol is plain CE
# (docs/HPO_GUIDE.md), so nothing is fed a frequency vector.
class_freq: null

datamodule:
  _target_: src.data.benchmark_image_datamodule.BenchmarkImageDataModule
  dataset_name: uoft-cs/cifar100
  image_column: img
  label_column: fine_label
  drop_columns: [coarse_label]
  val_split_size: 5000
  val_split_seed: 42
  num_classes: 100
  class_to_idx:

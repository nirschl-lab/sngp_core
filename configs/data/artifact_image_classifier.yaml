# configs/data/artifact_image_classifier.yaml

defaults:
  - /img_augmentations: light_augmentations

# Short, path-safe dataset identifier -- drives task_name/output-directory naming
# (see docs/OUTPUT_LAYOUT.md). Wraps the same HF dataset as acevedo.yaml via
# ArtifactImageDataModule, so this is disambiguated as the artifact-paired variant.
name: acevedo_artifact

datamodule:
  _target_: src.data.artifact_image_datamodule.ArtifactImageDataModule
  dataset_name: nirschl-lab/acevedo_et_al_2020
  num_classes: 8
  class_to_idx:
    basophil: 0
    eosinophil: 1
    erythroblast: 2
    immature_granulocyte: 3
    lymphocyte: 4
    monocyte: 5
    neutrophil: 6
    platelet: 7
  batch_size: 64
  num_workers: 32
  pin_memory: true
  test_all_folds: false
  sample_rate: 0
  institution: null # HF row-level institution id to filter to; null = all institutions
  simulate_artifacts_for_test: true

  # Artifact simulation. The bank is indexed on first use and the measurements cached
  # under $HISTO_ARTIFACTS_CACHE, so there is no manifest to maintain here.
  artifact_bank_dir: ${paths.artifact_bank_dir}
  # Categorises the bank per asset. Regenerate with scripts/artifact/build_taxonomy.py --
  # the flat folder layout alone puts 17% of assets in categories no policy mentions.
  artifact_taxonomy_csv: ${paths.root_dir}/data/artifact/artifact_taxonomy_by_image.csv
  # A policy shipped in histo-artifact-sim ("balanced" or "empirical"); a path to a
  # generated policy file also works. balanced gives all 11 categories equal occurrence,
  # which is what makes rare ones (focus, scratch_glass) measurable.
  artifact_config_path: balanced
  artifact_seed: 42
  # The optics the patches are read as. Recorded in provenance and used whenever
  # coverage is rescaled.
  artifact_patch_magnification: 40
  # Take the policy's coverage quartiles literally at whatever size the patch is. Under
  # the package default ("field_of_view") they would be rescaled from the 1024px field
  # they were measured on to Acevedo's 360px one -- an 8.09x multiplier that puts
  # tissue_component at 433% and bone_calcification at 375%, i.e. total occlusion. See
  # docs/DATASETS.md.
  artifact_coverage_scaling: fixed
  # Only consulted when artifact_coverage is "assets"; Acevedo's native patch edge.
  artifact_reference_patch_px: 360

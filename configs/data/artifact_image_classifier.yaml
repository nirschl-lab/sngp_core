# configs/data/artifact_image_classifier.yaml

defaults:
  - /img_augmentations: light_augmentations

# Short, path-safe dataset identifier -- drives task_name/output-directory naming
# (see docs/OUTPUT_LAYOUT.md). Wraps the same HF dataset as acevedo.yaml via
# ArtifactImageDataModule, so this is disambiguated as the artifact-paired variant.
name: acevedo_artifact

datamodule:
  _target_: src.data.artifact_image_datamodule.ArtifactImageDataModule
  dataset_name: nirschl-lab/acevedo_et_al_2020
  num_classes: 8
  class_to_idx:
    basophil: 0
    eosinophil: 1
    erythroblast: 2
    immature_granulocyte: 3
    lymphocyte: 4
    monocyte: 5
    neutrophil: 6
    platelet: 7
  batch_size: 64
  num_workers: 32
  pin_memory: true
  test_all_folds: false
  sample_rate: 0
  simulate_artifacts_for_test: true
  artifact_csv_path: ${paths.root_dir}/data/artifact/artifacts.csv
  artifact_config_path: ${paths.root_dir}/configs/artifact/balanced.yaml
  artifact_seed: 42

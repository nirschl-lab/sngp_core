defaults:
  - /img_augmentations: light_augmentations #albumentations #torchvision #default

# Short, path-safe dataset identifier -- drives task_name/output-directory naming
# (see docs/OUTPUT_LAYOUT.md). Distinct from datamodule.dataset_name below, which is
# the full HuggingFace repo id and unsafe to use as a directory segment.
name: tang

# Train-split counts, ordered by class_to_idx; see scripts/data/compute_class_freq.py.
# Kept outside `datamodule:` -- everything under `datamodule:` is passed as a
# ClassificationImageDataModule constructor kwarg via Hydra `_target_` instantiation.
class_freq: [1909, 2428, 47702, 9331]

datamodule:
  _target_: src.data.classification_image_datamodule.ClassificationImageDataModule
  dataset_name: nirschl-lab/tang_et_al_2019
  num_classes: 4
  class_to_idx:
    caa: 0
    cored: 1
    diffuse: 2
    negative: 3
  batch_size: 64
  num_workers: 32
  pin_memory: True
  test_all_folds: False
  sample_rate: 0
  institution: null # HF row-level institution id to filter to; null = all institutions

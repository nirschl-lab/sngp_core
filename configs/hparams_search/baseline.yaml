# @package _global_

# Hyperparameter search for the Baseline family, dataset-agnostic -- compose with
# `experiment=` to pick the dataset:
#   uv run src/train.py -m hparams_search=baseline experiment=baseline_tang
#
# Selects on macro-AUPRC (threshold-free, imbalance-robust -- see docs/HPO_GUIDE.md for
# the full protocol). val/nll and val/ece are logged every epoch as read-only
# calibration diagnostics; they never feed selection, early stopping, or checkpointing
# here -- calibration/uncertainty stay the evaluation axis, never the training-time
# selection axis, so a tuned model's generalization claim isn't compromised.
#
# Runs at a shortened proxy budget (max_epochs=50). model.scheduler.T_max is wired to
# ${trainer.max_epochs} in every experiment config, so CosineAnnealingLR rescales to
# the proxy budget automatically -- no manual schedule rescaling needed here. Retrain
# the top-3 trials (not just the winner -- proxy-budget rankings are noisy) at the
# experiment's full max_epochs=150 before picking a final config.

defaults:
  - override /hydra/sweeper: optuna

optimized_metric: "val/auprc_best"
sweep_fail_safe: true

trainer:
  min_epochs: 10
  max_epochs: 50

data:
  datamodule:
    num_workers: 8 # keep <= hydra.launcher.cpus_per_task when using submitit_slurm

callbacks:
  early_stopping:
    monitor: "val/auprc"
    mode: "max"
    patience: 8
    min_delta: 0.0
  model_checkpoint:
    monitor: "val/auprc"
    mode: "max"
    save_top_k: 1

logger:
  wandb:
    log_model: False # a 48-trial sweep must not upload 48 checkpoints as W&B artifacts
    group: "${name}_hpo"
    job_type: "sweep"

hydra:
  mode: "MULTIRUN"
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    # sqlite persistence: gives the study resume + a durable record of every trial.
    # Safe under a submitit_slurm fan-out because only the single sweeper process
    # (not the worker jobs) opens the study for writing.
    storage: sqlite:///${paths.log_dir}/optuna/${name}_hpo.db
    study_name: "${name}_hpo"
    n_jobs: 8
    direction: maximize
    n_trials: 48
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 1234
      # n_startup_trials should track n_jobs (how many trials run per batch), not
      # n_trials -- the old baseline_tang/sngp_tang configs set this equal to n_trials,
      # so TPE never actually engaged and every trial was pure random search.
      n_startup_trials: 10
      multivariate: true # lr and batch_size are coupled (LR scaling rule); model that
    params:
      model.optimizer.lr: tag(log, interval(0.00001, 0.01))
      model.optimizer.weight_decay: tag(log, interval(0.000001, 0.01))
      data.datamodule.batch_size: choice(64, 128, 256)
      # ClassBalancedFocalLoss params (see docs/HPO_GUIDE.md#search-space) -- these
      # shape the fit, not just calibration, since every experiment config used here
      # sets class_freq. cb_beta stays a discrete choice (Cui et al.'s
      # effective-number-of-samples formulation is conventionally reported this way).
      model.cb_beta: choice(0.9, 0.99, 0.999, 0.9999)
      model.focal_gamma: interval(0.0, 5.0)

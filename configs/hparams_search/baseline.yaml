# @package _global_

# Baseline hyperparameter-search RUN PRESET -- the half of an HPO run that lives in
# Hydra: proxy budget, objective, monitors, logger settings. The SEARCH SPACE lives in
# the sibling W&B sweep definition configs/hparams_search/wandb/baseline.yaml, which
# hands each trial its `model.optimizer.lr=...` overrides. One trial == one ordinary
# single-run invocation launched by a `wandb agent` (scripts/hpo/sweep.py):
#   uv run --no-sync python src/train.py hparams_search=baseline experiment=baseline_tang <overrides>
#
# Deliberately NO hydra.mode/MULTIRUN, NO sweeper override, NO fail-safe: the W&B
# controller owns the loop, and a crashed trial is just a crashed W&B run that the
# Bayesian search ignores (a fail-safe returning a floor value would rank as the *best*
# trial under a minimized NLL).
#
# Objective: validation NLL after post-hoc calibration, minimized (docs/HPO_GUIDE.md).
# For the baseline the knob is a temperature, refit each epoch on the val set as
# logits / T -- i.e. the selection sees what scripts/checkpoints/calibrate_checkpoint.py
# will report. hparams_search/sngp.yaml uses the mean-field factor the same way, so
# families are compared on equal footing.
#
# Search space (configs/hparams_search/wandb/baseline.yaml): lr, weight_decay,
# batch_size. dropout_p is fixed at 0.2 (MC-Dropout at inference needs it nonzero, and
# tuning it against a deterministic validation pass would push it to 0). Deep Ensemble
# is never swept: it inherits the tuned Baseline config.
#
# Proxy budget max_epochs=50; model.scheduler.T_max is wired to ${trainer.max_epochs} in
# every experiment config, so CosineAnnealingLR rescales itself. Retrain the top-3 at the
# experiment's full max_epochs before choosing a final config.

optimized_metric: "val/nll_cal_best" # must equal metric.name in wandb/baseline.yaml (tests/test_sweeps.py)

trainer:
  min_epochs: 10
  max_epochs: 50

data:
  datamodule:
    num_workers: 8 # keep <= --cpus-per-task in scripts/slurm/wandb_agent.sbatch

callbacks:
  early_stopping:
    monitor: "val/nll_cal" # epoch-level twin of the objective -- a running-min *_best never "fails to improve"
    mode: "min"
    patience: 8
    min_delta: 0.0
  model_checkpoint:
    monitor: "val/nll_cal"
    mode: "min"
    # A trial writes no checkpoint at all. Its weights are never loaded: the objective
    # reaches W&B through the logged val/nll_cal_best, and the protocol retrains the
    # top-3 from scratch at the experiment's full max_epochs (docs/HPO_GUIDE.md), so a
    # 50-epoch proxy checkpoint is never the model you keep -- it just cost 278 MB
    # (best + last) x run_cap. monitor/mode stay for the drift guards in
    # tests/test_sweeps.py; with save_top_k: 0 the monitor is inert.
    save_top_k: 0
    save_last: False

logger:
  wandb:
    # Inside a sweep agent, wandb.init() ignores project / entity / id (with a warning)
    # and keeps the run on the sweep. `name` IS honoured, so leave it to W&B -- otherwise
    # every trial shares one name. The group already carries the experiment.
    name: null
    log_model: False # a 48-trial sweep must not upload 48 checkpoints as W&B artifacts
    group: "${name}_hpo"
    job_type: "sweep"
    tags: "${tags_with:${tags},${data.datamodule.institution},hpo}"

hydra:
  run:
    # Several agents can start trials within the same wall-clock second, so the
    # timestamp-only default (configs/hydra/default.yaml) could collide. Suffix the W&B
    # run id (exported by `wandb agent` before train.py starts; "local" for a by-hand
    # run) and keep trials under sweeps/ so runs/ stays reserved for real training runs.
    dir: ${paths.log_dir}/${task_name}/sweeps/${name}_hpo/${now:%Y-%m-%d}_${now:%H-%M-%S}_${oc.env:WANDB_RUN_ID,local}

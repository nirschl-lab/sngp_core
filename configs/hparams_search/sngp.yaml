# @package _global_

# SNGP hyperparameter-search RUN PRESET -- the half of an HPO run that lives in Hydra:
# proxy budget, objective, monitors, logger settings. The SEARCH SPACE lives in the
# sibling W&B sweep definition configs/hparams_search/wandb/sngp.yaml, which hands each
# trial its `model.optimizer.lr=...` overrides. One trial == one ordinary single-run
# invocation launched by a `wandb agent` (scripts/hpo/sweep.py):
#   uv run --no-sync python src/train.py hparams_search=sngp experiment=sngp_tang <overrides>
#
# Deliberately NO hydra.mode/MULTIRUN, NO sweeper override, NO fail-safe: the W&B
# controller owns the loop, and a crashed trial is just a crashed W&B run that the
# Bayesian search ignores (a fail-safe returning a floor value would rank as the *best*
# trial under a minimized NLL).
#
# Objective: validation NLL after post-hoc calibration, minimized (docs/HPO_GUIDE.md).
# For SNGP the knob is the mean-field factor (the paper's kernel amplitude sigma), refit
# each epoch on the val set as raw_logits / sqrt(1 + factor * variance) -- i.e. the
# selection sees what scripts/checkpoints/calibrate_checkpoint.py will report.
# hparams_search/baseline.yaml uses a temperature the same way, so families are
# compared on equal footing.
#
# Search space (configs/hparams_search/wandb/sngp.yaml): lr, weight_decay, batch_size,
# model.net.spectral_norm_bound (the paper's c -- the only SNGP-specific swept knob).
# rff_dim / length_scale are fixed at the paper's values; ridge_penalty /
# mean_field_factor / cov_momentum are inference-only and stay post-hoc.
#
# Proxy budget max_epochs=50; model.scheduler.T_max is wired to ${trainer.max_epochs} in
# every experiment config, so CosineAnnealingLR rescales itself. Retrain the top-3 at the
# experiment's full max_epochs before choosing a final config.

optimized_metric: "val/nll_cal_best" # must equal metric.name in wandb/sngp.yaml (tests/test_sweeps.py)

trainer:
  min_epochs: 10
  max_epochs: 50

data:
  datamodule:
    num_workers: 8 # keep <= --cpus-per-task in scripts/slurm/wandb_agent.sbatch

callbacks:
  early_stopping:
    monitor: "val/nll_cal" # epoch-level twin of the objective -- a running-min *_best never "fails to improve"
    mode: "min"
    patience: 8
    min_delta: 0.0
  model_checkpoint:
    monitor: "val/nll_cal"
    mode: "min"
    # A trial writes no checkpoint at all. Its weights are never loaded: the objective
    # reaches W&B through the logged val/nll_cal_best, and the protocol retrains the
    # top-3 from scratch at the experiment's full max_epochs (docs/HPO_GUIDE.md), so a
    # 50-epoch proxy checkpoint is never the model you keep -- it just cost 278 MB
    # (best + last) x run_cap. monitor/mode stay for the drift guards in
    # tests/test_sweeps.py; with save_top_k: 0 the monitor is inert.
    save_top_k: 0
    save_last: False

logger:
  wandb:
    # Inside a sweep agent, wandb.init() ignores project / entity / id (with a warning)
    # and keeps the run on the sweep. `name` IS honoured, so leave it to W&B -- otherwise
    # every trial shares one name. The group already carries the experiment.
    name: null
    log_model: False # a 48-trial sweep must not upload 48 checkpoints as W&B artifacts
    group: "${name}_hpo"
    job_type: "sweep"
    tags: "${tags_with:${tags},${data.datamodule.institution},hpo}"

hydra:
  run:
    # sweeps/<sweep id>/<timestamp>_<run id>, keeping runs/ reserved for real training runs.
    #
    # The SWEEP ID -- not the experiment name -- is the grouping level: the parent
    # ${task_name} already says model+dataset, whereas a pilot, a re-sweep and a different
    # backbone are different *sweeps* that deserve separate folders. Look an id up in
    # docs/MASTER_SWEEPS.md. The run id suffix keeps several agents starting in the same
    # wall-clock second from colliding on the timestamp.
    #
    # Both env vars come from `wandb agent`: it sets WANDB_SWEEP_ID once per agent (to the
    # BARE id, not entity/project/id) and WANDB_RUN_ID per trial, then snapshots os.environ
    # into the trial subprocess. Keep the ",local" default on both -- a by-hand run and
    # `hydra.compose` in tests have neither, and a bare ${oc.env:...} would raise.
    dir: ${paths.log_dir}/${task_name}/sweeps/${oc.env:WANDB_SWEEP_ID,local}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${oc.env:WANDB_RUN_ID,local}

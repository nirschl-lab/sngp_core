# W&B sweep definition (SEARCH SPACE) for the ADRC study -- Muon weight decay x
# kernel_amplitude, experiment=sngp_muon_wong_sgd. Run preset:
# configs/hparams_search/sngp_muon_probit.yaml (pinned mean_field_factor = pi/8,
# objective val/nll_best).
# Plain W&B YAML: load with yaml.safe_load, never OmegaConf. Launch through
# scripts/hpo/sweep.py (it inserts experiment=..., and --name sets the sweep name / W&B group).
#
# Grid, not bayes: two discrete knobs, and every cell is wanted for the c-vs-sigma^2 picture.
# No early_terminate -- hyperband would kill grid cells; the preset's EarlyStopping
# (patience 8 on val/nll) already trims the waste.
program: src/train.py
method: grid
metric:
  name: val/nll_best # running min, so W&B's summary (= last logged) equals the best
  goal: minimize
parameters:
  # Muon's decoupled weight decay on the hidden convs -- what bounds their norm with no SN
  # (Acevedo: wd 0 best OOD, 0.1 best ID). The aux SGD group's L2 stays at 6e-4.
  model.optimizer.weight_decay:
    values: [0.0, 0.01, 0.03, 0.1, 0.3]
  # Kernel amplitude sigma^2 inside the random-feature map (phi scaled by sqrt(sigma^2)), so it
  # shapes training. Spans the SNGP paper's Table 10 range (1, 7.5, 20).
  model.net.kernel_amplitude:
    values: [0.5, 1.0, 2.0, 5.0, 10.0, 20.0]
command:
  - ${env}
  - uv
  - run
  - --no-sync # concurrent `uv run`s must not race to sync .venv; sweep.py syncs once up front
  - python
  - ${program}
  - hparams_search=sngp_muon_probit
  - ${args_no_hyphens}

# configs/callbacks/default.yaml
defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - test_artifacts
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "best" # Lightning appends its own .ckpt extension -- don't include it here
  monitor: "val/loss"
  mode: "min"
  save_last: True
  save_top_k: 1 # a static filename can't distinguish multiple "best" checkpoints; would collide into best-v1.ckpt otherwise
  auto_insert_metric_name: False

early_stopping:
  monitor: "val/f1"
  patience: 20
  mode: "max"

model_summary:
  max_depth: -1
